[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-first-learning"
version = "0.1.0"
description = "An audio-first companion for interruptible, conversational learning."
requires-python = ">=3.9"
dependencies = [
    "pyttsx3>=2.90,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
